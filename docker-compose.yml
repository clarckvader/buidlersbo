# Postgres local para desarrollo. En producción se usa Render Postgres.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: buidlers
      POSTGRES_PASSWORD: buidlers
      POSTGRES_DB: buidlers
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
